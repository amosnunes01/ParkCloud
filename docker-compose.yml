
# ===============================================================
# ParkCloud Smart Parking Management System — Docker Compose
# Production-ready multi-container orchestration with healthchecks,
# dedicated bridge networking, resource limits, and persistent volumes.
# ===============================================================

services:
  # -------------------------------------------------------------
  # Backend REST API Service (Node.js)
  # -------------------------------------------------------------
  api:
    container_name: parkcloud-api
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: parkcloud/api:1.0.0
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5000
      - TZ=Asia/Kolkata
      - S3_BUCKET=${S3_BUCKET:-parkcloud-storage-ap-south-1-i4dkpdh5}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
    ports:
      - "${API_PORT:-5001}:5000"
    volumes:
      - parkcloud-data:/opt/parkcloud/data
    networks:
      - parkcloud-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    labels:
      org.opencontainers.image.title: "ParkCloud API"
      org.opencontainers.image.description: "Backend REST service for ParkCloud Smart Parking"
      org.opencontainers.image.version: "1.0.0"

  # -------------------------------------------------------------
  # Frontend Web & Reverse Proxy Service (Nginx)
  # -------------------------------------------------------------
  web:
    container_name: parkcloud-web
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: parkcloud/web:1.0.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-80}:80"
    volumes:
      - nginx-logs:/var/log/nginx
    networks:
      - parkcloud-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    labels:
      org.opencontainers.image.title: "ParkCloud Web"
      org.opencontainers.image.description: "Frontend SPA & reverse proxy for ParkCloud Smart Parking"
      org.opencontainers.image.version: "1.0.0"

# ---------------------------------------------------------------
# Custom Bridge Network for Inter-Container Communication
# ---------------------------------------------------------------
networks:
  parkcloud-net:
    driver: bridge
    name: parkcloud-network

# ---------------------------------------------------------------
# Named Persistent Storage Volumes
# ---------------------------------------------------------------
volumes:
  parkcloud-data:
    name: parkcloud-storage
  nginx-logs:
    name: parkcloud-nginx-logs
